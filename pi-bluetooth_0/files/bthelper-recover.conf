# The Bluetooth of the Pi 3 Model B, without flow control, can stop answering at boot:
# /usr/lib/pi-bluetooth/hci-uart-recover powers it again, systemd starts bthelper again,
# three attempts in two minutes at most
[Unit]
StartLimitIntervalSec=120
StartLimitBurst=4

[Service]
Restart=on-failure
RestartSec=3
ExecStopPost=/usr/lib/pi-bluetooth/hci-uart-recover %I
