# brcmfmac: no firmware supplicant (FWSUP, 0x2000) and no SAE offload (0x80000), so that wpa_supplicant
# runs the WPA handshake itself. wpa_supplicant 2.12 hands the 4-way handshake to the firmware when it
# offers FWSUP, and the BCM43430 firmware of linux-firmware (7.45.98.118, Raspberry Pi 3) never completes
# it: the association succeeds, then "Authentication with <bssid> timed out" after 10 seconds.
options brcmfmac feature_disable=0x82000
